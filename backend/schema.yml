components:
  schemas:
    DayEnum:
      enum:
      - MON
      - TUE
      - WED
      - THU
      - FRI
      type: string
      description: |-
        * `MON` - Monday
        * `TUE` - Tuesday
        * `WED` - Wednesday
        * `THU` - Thursday
        * `FRI` - Friday
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_year:
          type: string
          format: uuid
        academic_year_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 50
        code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - academic_year_name
      - code
      - created_at
      - id
      - name
      - updated_at
    LessonRequirement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        term:
          type: string
          format: uuid
        term_name:
          type: string
          readOnly: true
        teaching_group:
          type: string
          format: uuid
        teaching_group_name:
          type: string
          readOnly: true
        subject:
          type: string
          format: uuid
        subject_name:
          type: string
          readOnly: true
        lessons_per_week:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lessons_per_week
      - subject
      - subject_name
      - teaching_group
      - teaching_group_name
      - term
      - term_name
      - updated_at
    PatchedGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        academic_year:
          type: string
          format: uuid
        academic_year_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 50
        code:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedLessonRequirement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        term:
          type: string
          format: uuid
        term_name:
          type: string
          readOnly: true
        teaching_group:
          type: string
          format: uuid
        teaching_group_name:
          type: string
          readOnly: true
        subject:
          type: string
          format: uuid
        subject_name:
          type: string
          readOnly: true
        lessons_per_week:
          type: integer
          maximum: 32767
