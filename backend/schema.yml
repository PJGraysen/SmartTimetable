  /api/scheduling/runs/{id}/execute/:
    post:
      operationId: scheduling_runs_execute
      description: Execute timetable generation for a pending or running scheduling
        run.
      summary: Execute a scheduling run
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingRunExecute'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchedulingRunExecute'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchedulingRunExecute'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingRunResult'
          description: ''
        '409':
          description: The scheduling run cannot be executed in its current state
            or the scheduling request is invalid.
        '500':
          description: Scheduling execution failed.
  /api/scheduling/runs/{id}/results/:
    get:
      operationId: scheduling_runs_results
      description: |-
