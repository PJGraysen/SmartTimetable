          description: ''
    post:
      operationId: scheduling_runs_create
      description: Create a new pending scheduling run for an academic term.
      summary: Create a scheduling run
      tags:
      - scheduling
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingRunCreate'
          application/x-www-form-urlencoded:
